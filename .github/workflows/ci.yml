name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Sofia.UI/package-lock.json

      - name: Test server
        run: dotnet test Sofia.slnx -c Release

      - name: Test Avalonia UI (headless render gate)
        run: dotnet test src/Sofia.App.Tests -c Release

      # Plan 044: the WASM head must keep building until the Vue cutover; its publish is the
      # artifact Sofia.Server serves when the parity gate passes.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish Avalonia browser head
        run: dotnet publish src/Sofia.App.Browser -c Release -r browser-wasm -o out/browser -p:UseSharedCompilation=false

      - name: Assert browser bundle layout
        run: |
          test -f out/browser/wwwroot/index.html
          test -f out/browser/wwwroot/main.js
          test -f out/browser/wwwroot/_framework/dotnet.js

      - name: Typecheck and build UI
        working-directory: src/Sofia.UI
        run: |
          npm ci
          npm run typecheck
          npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build (and push outside pull requests)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
